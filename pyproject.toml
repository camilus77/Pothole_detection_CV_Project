[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pothole_detector"
version = "0.0.1"
description = "This project details my MSc work at Bangor University"
authors = [
  { name = "UBONG CAMILUS BEN" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["pothole_detector"]
include = ["pyproject.toml", "pothole_detector/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["pothole_detector"]
force-sort-within-sections = true

